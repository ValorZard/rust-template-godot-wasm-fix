# No Threads Default
[target.wasm32-unknown-emscripten]
# link against emcc itself and not .bat
linker = "emcc"
rustflags = [
    "-C",
    "link-args=-sSIDE_MODULE=2",
    "-C",
    "llvm-args=-enable-emscripten-cxx-exceptions=0",
    "-Z",
    "default-visibility=hidden",
    "-Z",
    "link-native-libraries=no",
    # rust now uses wasm exception handling, but Godot's web export doesn't.
    # so we just turn any exception handling off. 
    # Unfortunately, this means if a Godot Rust game crashes on the web, we will have no idea why.
    "-Z",
    "unstable-options",
    "-C",
    "panic=immediate-abort",
]
